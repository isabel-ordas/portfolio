<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<body>
<div id="root"></div>
<script>
/* Loads the portable content JSON (see /content) into window.CONTENT before
   the component scripts below run. Uses a synchronous XHR (not fetch) so the
   plain <script> loading order below stays intact with no bundler and no
   async rewrite of the components. This means the page must be served over
   http(s) — opening index.html directly via file:// will fail here, since
   browsers block XHR/fetch to local files across the file:// origin. */
(function(){
  function loadJSON(path){
    var xhr = new XMLHttpRequest();
    xhr.open('GET', path, false);
    xhr.send(null);
    if (xhr.status !== 0 && xhr.status !== 200) {
      throw new Error('Failed to load ' + path + ' (status ' + xhr.status + '). This page must be served over http(s), not opened directly as a file.');
    }
    return JSON.parse(xhr.responseText);
  }
  var projectIds = ['bondly', 'reuse-loops', 'grid-signals', 'talent-paths'];
  window.CONTENT = {
    site: loadJSON('../../content/site.json'),
    home: loadJSON('../../content/home.json'),
    about: loadJSON('../../content/about.json'),
    writing: loadJSON('../../content/writing.json'),
    projects: projectIds.map(function(id){ return loadJSON('../../content/projects/' + id + '.json'); })
  };
})();
</script>
<script type="text/babel" src="Chrome.jsx"></script>
<script type="text/babel" src="Home.jsx"></script>
<script type="text/babel" src="CaseStudy.jsx"></script>
<script type="text/babel" src="About.jsx"></script>
<script type="text/babel">
function App(){
  const [route,setRoute] = React.useState('home');
  const go = (r) => { setRoute(r); window.scrollTo(0,0); };
  const View = { home: Home, case: CaseStudy, about: About, writing: Writing }[route] || Home;
  return (
    <div>
      <Header route={route} go={go} />
      <View go={go} />
      <Footer go={go} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
