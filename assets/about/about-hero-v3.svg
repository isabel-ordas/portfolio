<svg xmlns="http://www.w3.org/2000/svg" viewBox="25.6 25.6 148.8 148.8" width="100%" role="img" aria-labelledby="ih-title ih-desc">
<title id="ih-title">Product thinking, building and sound judgment growing positive impact</title>
<desc id="ih-desc">Isabel's logo, four shapes in a grid, rearranges itself. The green square shrinks into a seed and drops into the brown square, the soil of values and judgment. The blue circle becomes a water drop, for product thinking, and rises. The soil slides under it and rounds into a mound. The drop falls through it and forms its lower half: a circle of soil and water. The yellow sun, for building, swells once as two green leaves sprout from the circle: positive impact.</desc>
<style>
.ih-fb{transform-box:fill-box;transform-origin:center}
#ih-seed{animation:ih-seed 1.7s .5s both}
#ih-soil{transform-box:view-box;transform-origin:73.6px 114.4px;animation:ih-soil .5s 1.7s both cubic-bezier(.4,0,.2,1)}
#ih-clip{transform-box:view-box;transform-origin:73.6px 126.4px;animation:ih-clip .5s 1.7s both cubic-bezier(.4,0,.2,1)}
#ih-drop{animation:ih-drop 1.7s 1.1s both}
#ih-dc{animation:ih-dc .5s 1.1s both cubic-bezier(.4,0,.2,1)}
#ih-dt{transform-box:fill-box;transform-origin:50% 100%;animation:ih-dt .25s 1.35s both cubic-bezier(0,0,.2,1)}
#ih-water{transform-box:view-box;transform-origin:73.6px 126.4px;animation:ih-dt .25s 2.55s both cubic-bezier(0,0,.2,1)}
.ih-l{transform-box:view-box;transform-origin:73.6px 103px;animation:ih-leaf .5s both cubic-bezier(0,0,.2,1)}
#ih-l1{animation-delay:2.9s}#ih-l2{animation-delay:3.05s}
#ih-sun{animation:ih-sun .8s 2.9s both cubic-bezier(.4,0,.2,1)}
@keyframes ih-sun{50%{transform:scale(1.1)}}
@keyframes ih-seed{0%{transform:translateY(-44.4px) scale(4);animation-timing-function:cubic-bezier(.4,0,.2,1)}11.8%{transform:translateY(-44.4px);animation-timing-function:cubic-bezier(.4,0,.2,1)}29.4%,70.6%{transform:translateX(52.8px);animation-timing-function:cubic-bezier(.4,0,.2,1)}100%{transform:none}}
@keyframes ih-soil{from{transform:translate(52.8px,12px) scale(1,2)}}
@keyframes ih-clip{from{transform:scale(1.42)}}
@keyframes ih-drop{0%{opacity:1;transform:translateY(44.4px);animation-timing-function:cubic-bezier(.4,0,.2,1)}29.4%,70.6%{opacity:1;transform:none;animation-timing-function:cubic-bezier(.4,0,1,1)}99%{opacity:1;transform:translateY(52.8px)}100%{opacity:0;transform:translateY(52.8px)}}
@keyframes ih-dc{from{transform:scale(1.5)}}
@keyframes ih-dt{from{transform:scaleY(0)}}
@keyframes ih-leaf{from{transform:scale(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><clipPath id="ih-c"><circle id="ih-clip" cx="73.6" cy="126.4" r="24"/></clipPath></defs>
<circle id="ih-sun" class="ih-fb" cx="126.4" cy="73.6" r="24" fill="#F2B705"/>
<rect id="ih-seed" class="ih-fb" x="67.6" y="112" width="12" height="12" fill="#2F7A3C"/>
<path id="ih-water" d="M49.6 126.4A24 24 0 0 0 97.6 126.4Z" fill="#1F5FA8"/>
<g transform="translate(73.6 73.6)"><g id="ih-drop" opacity="0">
<polygon id="ih-dt" points="0,-24 13.86,0 -13.86,0" fill="#1F5FA8"/>
<circle id="ih-dc" class="ih-fb" cx="0" cy="8" r="16" fill="#1F5FA8"/>
</g></g>
<path id="ih-l1" class="ih-l" d="M71.6 102.4A24 24 0 0 1 47.6 78.4A24 24 0 0 1 71.6 102.4Z" fill="#2F7A3C"/>
<path id="ih-l2" class="ih-l" d="M75.6 102.4A16 16 0 0 0 91.6 86.4A16 16 0 0 0 75.6 102.4Z" fill="#2F7A3C"/>
<g id="ih-soil"><rect x="49.6" y="102.4" width="48" height="24" fill="#7A4B32" clip-path="url(#ih-c)"/></g>
</svg>